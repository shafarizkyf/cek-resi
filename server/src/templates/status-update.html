<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking Update</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: #2563eb; color: white; padding: 20px; border-radius: 8px 8px 0 0; }
    .header h1 { margin: 0; font-size: 20px; }
    .content { background: #f9fafb; padding: 20px; border-radius: 0 0 8px 8px; }
    .info { display: flex; gap: 20px; margin-bottom: 20px; }
    .info-item { flex: 1; }
    .info-label { font-size: 12px; color: #6b7280; text-transform: uppercase; }
    .info-value { font-size: 16px; font-weight: 600; }
    .status { display: inline-block; background: #dbeafe; color: #1e40af; padding: 4px 12px; border-radius: 12px; font-size: 14px; font-weight: 500; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #f3f4f6; font-size: 12px; text-transform: uppercase; color: #6b7280; }
    tr:last-child td { border-bottom: none; }
    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📦 Tracking Update</h1>
  </div>
  <div class="content">
    <div class="info">
      <div class="info-item">
        <div class="info-label">AWB</div>
        <div class="info-value">{{AWB}}</div>
      </div>
      <div class="info-item">
        <div class="info-label">Courier</div>
        <div class="info-value">{{COURIER}}</div>
      </div>
      <div class="info-item">
        <div class="info-label">Status</div>
        <div class="status">{{LATEST_STATUS}}</div>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Location</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        {{HISTORY_ROWS}}
      </tbody>
    </table>
  </div>
  <div class="footer">
    <p>Cek Resi - Track your packages</p>
  </div>
</body>
</html>
